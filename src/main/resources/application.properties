# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# GraphQL
spring.graphql.graphiql.enabled=true

# MCP
# GATool serves the three dynamic tools below alone at /mcp: this folder does not exist, so GATool
# skips the operation files, which the frontend still sends from operations/
gatool.mcp.operations.locations=optional:classpath*:none/
# An MCP client connects without signing in, which suits a laptop. A deployed server secures /mcp.
gatool.mcp.security.unsafe.allow-mcp-calls-without-authentication=true

# Dynamic tools
# Three tools, with which the model writes its own GraphQL: searchSchema, introspectType
# and executeGraphql. MCP clients and the assistant both get them.
gatool.dev.experimental.generate-tools=dynamic-three-step
# searchSchema ranks the schema's fields by meaning, with the embedding model pulled in the setup
gatool.dev.experimental.dynamic-operations.search-backend=embedding
spring.ai.ollama.embedding.model=qwen3-graphql-embedder

# Chat
# The assistant in the frontend gets the same three tools, inside the application
gatool.in-process.operations.locations=optional:classpath*:none/
# The chat model in Ollama, pulled in the setup with: ollama pull qwen3:8b
spring.ai.ollama.chat.model=qwen3:8b
# The model reasons before it answers: slower, and its bookings come out right more often
spring.ai.ollama.chat.think=true
# The model reads the tools, the question and the tool results within this many tokens.
# Ollama picks a size from your memory when this is unset, so set it for the same result on every laptop.
spring.ai.ollama.chat.num-ctx=8192
# One call to the model, so the chat reports at once when Ollama is not running. By default
# Spring AI tries a failed call 10 more times, with pauses that grow to 3 minutes.
spring.ai.retry.max-attempts=0
# The calls to the model go through the JDK's HTTP client. Reactor Netty, which Spring AI also
# brings, logs an ERROR about DNS on macOS at its first call.
spring.http.clients.imperative.factory=jdk
# Logs the name of each tool the model calls
logging.level.org.springframework.ai.model.tool=DEBUG

# What the model of an MCP client reads when it connects. This text replaces GATool's, so it names
# the topics of the API and then says how to use the three tools. Spring Boot reads this file as
# ISO-8859-1, so the value writes the â of Alfândega as \u00e2.
spring.ai.mcp.server.instructions=This server answers questions about a veterinary clinic in Porto, Portugal, and about \
  public data on daily life in Portugal, Porto and the European Union. \
  The API holds the clinic's owners, their pets and visits, and its vets. It also reads public services: \
  the weather forecast, warnings, sea and earthquakes (IPMA); beaches, bathing water, rivers, floods and the \
  environment (APA); hospitals and health statistics (SNS); statistics such as population, businesses by activity, \
  prices, crimes and trade (INE and Eurostat); tourism and the local lodging register (Turismo de Portugal); \
  Porto's buses, air quality, parks and places, such as the Alf\u00e2ndega do Porto (Porto Digital); and the fuel \
  prices of every filling station (DGEG). \
  For a question on any of these topics, search the schema before you decide the API cannot answer it. \
  Find the fields with searchSchema, use introspectType if you need more details about a type, and run the query \
  with executeGraphql. When an answer comes from a public service, name the service.

# Portuguese public services
# The schema also reads public services of Portugal, Porto and the EU. These are the live URLs;
# the "mock" profile points them at answers recorded from the services, see application-mock.properties.
petclinic.upstream.connect-timeout=10s
petclinic.upstream.read-timeout=20s
# Several services ask callers to name their application
petclinic.upstream.user-agent=spring-petclinic-portotechhub (https://github.com/graphqlguy/portotechhub-workshop)
# Each service has a block of its own below, headed with its name

# Statistics Portugal (INE): its indicators, through its JSON API
petclinic.upstream.ine.url=https://www.ine.pt

# IPMA, the Portuguese Institute for Sea and Atmosphere: forecasts, warnings, earthquakes and observations
petclinic.upstream.ipma.url=https://api.ipma.pt

# Eurostat, the statistical office of the European Union: its datasets, through its JSON-stat API
petclinic.upstream.eurostat.url=https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data

# The Portuguese Environment Agency (APA): the layers of its SNIAmb ArcGIS server, such as the bathing waters
petclinic.upstream.apa.url=https://sniambgeoogc.apambiente.pt/getogc/rest/services

# Turismo de Portugal: the layers of its open data ArcGIS server, such as the local lodging register
petclinic.upstream.turismo.url=https://geo.turismodeportugal.pt/server/rest/services

# The transparency portal of the National Health Service (SNS): its datasets, through the OpenDataSoft API
petclinic.upstream.sns.url=https://transparencia.sns.gov.pt

# Porto Digital's urban platform, a FIWARE context broker: air quality, buses, parking and points of interest
petclinic.upstream.porto.url=https://broker.fiware.urbanplatform.portodigital.pt

# ROPI, Porto Digital's register of points of interest, such as its parks and gardens. Its documentation asks for a
# token, and its reads answer without one.
petclinic.upstream.ropi.url=https://api.ropi.porto.digital

# DGEG's fuel prices, from the API of its portal Pre\u00e7os dos Combust\u00edveis Online, which is undocumented.
# DGEG allows free reuse that names DGEG, gives the time of the last update and reproduces the prices faithfully.
petclinic.upstream.dgeg.url=https://precoscombustiveis.dgeg.gov.pt

# JPA
spring.jpa.hibernate.ddl-auto=none
# GraphQL reads lazy relationships, such as the pets of an owner, while it builds the
# response, so the persistence context stays open until the request ends
spring.jpa.open-in-view=true
# Logs every SQL statement. Chapter 2 turns it on to count the statements of a query.
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Workshop
# Pauses every service call for this long, so that each database round trip shows in the
# response time. Chapter 2 sets it to 1s.
petclinic.demo.latency=0s

# Internationalization
spring.messages.basename=messages/messages

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
