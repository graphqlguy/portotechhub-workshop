# Mock mode: the public services are answered by a server inside the application, with answers
# recorded from the live services. Start it with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mock
# The recordings are in src/main/resources/mock-upstreams
petclinic.mock.port=9091
petclinic.mock.url=http://localhost:${petclinic.mock.port}
petclinic.upstream.ine.url=${petclinic.mock.url}/ine
petclinic.upstream.ipma.url=${petclinic.mock.url}/ipma
petclinic.upstream.eurostat.url=${petclinic.mock.url}/eurostat
petclinic.upstream.apa.url=${petclinic.mock.url}/apa
petclinic.upstream.turismo.url=${petclinic.mock.url}/turismo
petclinic.upstream.sns.url=${petclinic.mock.url}/sns
petclinic.upstream.porto.url=${petclinic.mock.url}/porto
petclinic.upstream.ropi.url=${petclinic.mock.url}/ropi
petclinic.upstream.dgeg.url=${petclinic.mock.url}/dgeg
# The moment the answers were recorded. The assistant and the fields that ask for "now" use it,
# so a question about tomorrow or right now finds the recorded answers on any later day.
petclinic.now=2026-11-05T22:20:59Z
